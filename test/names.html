<!DOCTYPE html><meta charset="UTF-8"><pre id="out"></pre>

<script>
// 四股名のサンプルを出す: msedge --headless --dump-dom test/names.html
let seed = 7; const rng = () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
